<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>喵喵茶馆 - 猫咪珍珠奶茶店</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="喵喵茶馆游戏画布"></canvas>
  <div id="rotate-overlay" role="dialog" aria-label="横屏提示">
    <div class="rotate-card">
      <div class="rotate-phone" aria-hidden="true"></div>
      <p class="rotate-title">横屏体验更佳</p>
      <p class="rotate-sub">请将手机横过来玩喵~</p>
      <button type="button" id="rotate-dismiss">继续竖屏游玩</button>
    </div>
  </div>
  <button type="button" id="fs-btn" aria-label="全屏切换">全屏</button>
  <p class="sr-only">
    喵喵茶馆按键说明：数字键 1 红茶、2 绿茶、3 奶茶、4 果茶用于冲茶；
    Q 珍珠、W 布丁、E 红豆、R 椰果用于加料；S 键摇杯；空格键出杯；X 键倒掉手里的饮品；
    P 暂停；M 静音；Shift+R 重新开始；标题与结算画面按 Enter 或空格。
    也可以用鼠标点击按钮、摇杯器和顾客点单票。
  </p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
